# Example 02: single-trait animal model for weaning weight with REML.
# Data: the SYNTHETIC sheep flock in ../sheep_data (generated by
# `abp simulate-sheep --seed 20260925`). Three weights were entered with a
# misplaced decimal point; the declared valid range catches them and the
# approved QC rule quarantines them (they are listed in qc_excluded_records.csv).
schema_version = "1"

[project]
name = "sheep_wwt_reml"
species = "sheep"
synthetic_data = true
description = "Weaning weight EBVs from a pedigree animal model; variances by REML."

[analysis]
task = "additive_ebv"
target_population = "synthetic two-flock sheep population, lamb crops 2021-2025"
information_cutoff = "2025-12-31"
genetic_base = "founders born 2018-2019 (unknown parents): unrelated, non-inbred, mean 0"
applicability = "demonstration only; synthetic data"

[data]
pedigree = "../sheep_data/data/pedigree.csv"
phenotypes = "../sheep_data/data/lambs.csv"

[data.pedigree_columns]
sex = "sex"
birth_date = "birth_date"

[[traits]]
name = "wwt"
unit = "kg"
min = 5.0
max = 80.0
description = "weaning weight"

[model]
traits = ["wwt"]
intercept = true
fixed = [
  { column = "cg", type = "factor" },          # contemporary group: flock x year x sex
  { column = "birth_type", type = "factor" },  # born single / twin / triplet
  { column = "dam_age", type = "factor" },     # age class of the dam
]
random = [{ name = "animal", kind = "additive", relationship = "pedigree" }]

[variances]
mode = "reml"

[reml]
algorithm = "ai"
max_iter = 100
tol = 1e-8

[qc]
out_of_range = "quarantine"

[output]
top_n = 15
