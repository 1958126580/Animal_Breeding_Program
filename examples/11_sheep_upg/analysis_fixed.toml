# Example 11b: unknown-parent groups as FIXED effects for a flock that buys its rams
# from external breeders without recorded ancestry.
# Data: SYNTHETIC, generated by `python examples/11_sheep_upg/make_data.py`
# (seed 20260925; truth in ./truth is for compare.py only, never model input).
# Parent codes starting with "UPG:" name genetic groups by origin and purchase
# period; "0" is an ungrouped unknown parent (the local base flock).
schema_version = "1"

[project]
name = "sheep_wwt_upg_fixed"
species = "sheep"
synthetic_data = true
description = "Weaning weight EBVs with fixed unknown-parent groups for purchased rams."

[analysis]
task = "additive_ebv"
target_population = "synthetic closed ewe flock with purchased rams, lamb crops 2016-2024"
information_cutoff = "2024-12-31"
genetic_base = "local base flock born 2011-2015 (ungrouped unknown parents): mean 0"
applicability = "demonstration only; synthetic data"

[data]
pedigree = "data/pedigree.csv"
phenotypes = "data/weaning.csv"

[data.pedigree_columns]
sex = "sex"
birth_date = "birth_year"

[[traits]]
name = "wwt"
unit = "kg"
min = 5.0
max = 80.0
description = "weaning weight"

[model]
traits = ["wwt"]
intercept = true
fixed = [
  { column = "year", type = "factor" },
  { column = "sex", type = "factor" },
]
random = [{ name = "animal", kind = "additive", relationship = "pedigree" }]

[upg]
prefix = "UPG:"
effect = "fixed"

# Fixed groups make the genetic covariance improper, so REML is refused;
# the variances are declared (here: the simulation values).
[variances]
mode = "known"
values = { animal = 4.0, residual = 12.0 }

[output]
top_n = 10
