# Example 17: two repeated ewe traits with a permanent environment - litter weight at
# weaning (lwt) and ewe body condition score (bcs), one record of each per lambing
# (1-4 lambings per ewe). Bayesian multi-trait linear model: genetic (G0),
# permanent-environment (P0) and residual (R0) covariance matrices sampled with the
# EBVs; the permanent environment ("pe", one level per ewe) keeps the repeated
# records of a ewe from being treated as independent.
# The data are SYNTHETIC and made by make_data.py (seed 20261001); true values
# (truth/, for validation only): G0 = [[4.0, 0.3], [0.3, 0.06]],
# P0 = [[3.0, 0.2], [0.2, 0.05]], R0 = [[13.0, 0.6], [0.6, 0.29]].
schema_version = "1"

[project]
name = "sheep_ewe_repeated_bayes"
species = "sheep"
synthetic_data = true

[analysis]
task = "additive_ebv"
target_population = "synthetic two-flock sheep population, ewes lambing 2021-2025"
information_cutoff = "2025-12-31"
genetic_base = "founders born 2018-2019 (unknown parents): unrelated, non-inbred, mean 0"
applicability = "demonstration only"

[data]
pedigree = "../sheep_data/data/pedigree.csv"
phenotypes = "data/ewe_records.csv"

[data.pedigree_columns]
sex = "sex"
birth_date = "birth_date"

[data.phenotype_columns]
record_id = "record_id"

[[traits]]
name = "lwt"
unit = "kg"
min = 0.0
max = 80.0
description = "litter weight at weaning"

[[traits]]
name = "bcs"
unit = "score"
min = 0.5
max = 5.5
description = "ewe body condition score at weaning"

[model]
traits = ["lwt", "bcs"]
fixed = [
  { column = "flock_year", type = "factor" },   # contemporary group
  { column = "parity", type = "factor" },
]
random = [
  { name = "animal", kind = "additive", relationship = "pedigree" },
  { name = "pe", kind = "iid" },          # permanent environment of the ewe (column: id)
]

[variances]
mode = "bayes"

[bayes]
method = "multitrait"
chains = 4
iterations = 4000
burn_in = 1000
thin = 5
max_iterations = 16000

[qc]
out_of_range = "quarantine"

[output]
top_n = 15
