[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abp-breeding"
version = "0.2.0"
description = "ABP: auditable genetic evaluation (pedigree/genomic BLUP, REML, selection index) for animal breeding"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Animal_Breeding_Program contributors" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
abp = "abp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: statistical-calibration or scale tests (deselect with -m 'not slow')",
]
