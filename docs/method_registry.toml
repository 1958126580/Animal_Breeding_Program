name = "PLINK 1 binary genotype reader (.bed/.bim/.fam, SNP-major)"
estimand = "not applicable (input)"
scope = "biallelic variants; counted allele A1; assembly declared by the user"
math = "docs/methods.md#15-plink-1-binary-input"
sources = ["PLINK 1.9 file format documentation"]
errata = []
exact_or_approximate = "exact"
complexity = "O(samples x variants) via a 256-entry lookup table"
code = ["src/abp/io/plink.py"]
tests = ["tests/test_plink.py::test_hand_derived_bytes",
         "tests/test_plink.py::test_round_trip_and_loader",
         "tests/test_plink.py::test_bad_files",
         "tests/test_plink.py::test_plink_and_dosage_inputs_give_identical_gblup"]
gates = { G0 = "passed", G1 = "not_applicable", G2 = "passed", G3 = "passed", G4 = "not_applicable", G5 = "not_run", G6 = "linux_measured", G7 = "not_run" }
implementation_status = "passed"
maturity = "experimental"
known_limits = ["no individual-major .bed, PLINK 2 (.pgen), VCF or BGEN", "ref/alt unknown from .bim"]
dependencies = ["numpy"]

[[method]]
method_id = "bayes.markers"
name = "Bayesian marker regression: BRR, BayesA, BayesB, BayesC, BayesCpi, BayesR (Gibbs)"
estimand = "posterior mean and SD of genomic breeding values w'beta relative to the genomic base"
scope = "single trait, one record per animal, genotyped animals; pi0 = probability of a zero effect"
math = "docs/methods.md#16-bayesian-marker-models-and-mcmc-diagnostics"
sources = ["Meuwissen, Hayes & Goddard 2001 Genetics 157:1819", "Habier et al. 2011 BMC Bioinformatics 12:186", "Erbe et al. 2012 J Dairy Sci 95:4114"]
errata = ["BayesR variance ratios applied to centred (not standardised) genotypes - stated as ABP's parameterization"]
exact_or_approximate = "MCMC (Monte-Carlo error reported); results withheld unless diagnostics pass"
complexity = "O(records x markers) per iteration and chain; optional C++ sweep"
code = ["src/abp/solvers/bayes.py", "src/abp/workflows/bayes_eval.py", "src/abp/_native.cpp"]
tests = ["tests/test_bayes.py::test_inclusion_probability_matches_exact_marginal_likelihood",
         "tests/test_bayes.py::test_explicit_priors_traces_and_draws",
         "tests/test_bayes.py::test_brr_fixed_variances_matches_exact_gaussian_posterior",
         "tests/test_bayes.py::test_bayescpi_recovers_sparse_architecture",
         "tests/test_bayes.py::test_all_methods_run_and_report_diagnostics",
         "tests/test_bayes.py::test_seed_determinism_and_chain_independence",
         "tests/test_bayes.py::test_native_sweep_matches_python_reference",
         "tests/test_bayes_workflow.py::test_example10_converges_and_writes_outputs",
         "tests/test_bayes_workflow.py::test_nonconvergence_withholds_results"]
# G4: prior simulation-based calibration, benchmarks/sbc_bayes.py, 300 replicates per method,
# all 32 rank-uniformity tests passed (smallest p 0.029) -> docs/validation/sbc_bayes.json;
# plus the exact Gaussian posterior check for BRR with fixed variances.
gates = { G0 = "passed", G1 = "passed", G2 = "passed", G3 = "passed", G4 = "passed_prior_sbc_300_replicates_all_methods", G5 = "not_run", G6 = "linux_measured", G7 = "not_run" }
implementation_status = "passed"
maturity = "experimental"
known_limits = ["single trait, no permanent-environment term", "no single-step Bayesian model", "BayesCpi pi0 may mix slowly (example data withheld at 16,000 iterations)", "prior SBC on a small design (150 records x 40 markers); no posterior SBC near real data"]
dependencies = ["numpy", "scipy"]

[[method]]
method_id = "diag.mcmc"
name = "MCMC diagnostics: rank-normalized split R-hat, bulk/tail ESS, MCSE"
estimand = "convergence and Monte-Carlo precision of posterior summaries"
scope = "Gibbs chains, arrays (chains, draws); applied to scalars and every GEBV"
math = "docs/methods.md#16-bayesian-marker-models-and-mcmc-diagnostics"
sources = ["Vehtari, Gelman, Simpson, Carpenter & Buerkner 2021 Bayesian Analysis 16:667"]
errata = []
exact_or_approximate = "estimators as published (Stan conventions)"
complexity = "O(draws log draws) per quantity (FFT)"
code = ["src/abp/solvers/mcmc_diagnostics.py"]
tests = ["tests/test_mcmc_diagnostics.py::test_iid_draws",
         "tests/test_mcmc_diagnostics.py::test_ar1_effective_sample_size",
         "tests/test_mcmc_diagnostics.py::test_nonmixing_chains_are_flagged",
         "tests/test_mcmc_diagnostics.py::test_summary_fields",
         "tests/test_mcmc_diagnostics.py::test_agreement_with_arviz_reference_values",
         "tests/test_bayes.py::test_skipped_gebv_diagnostics_are_reported_not_silent"]
# G2: agreement with ArviZ 0.23.4 (independent implementation) <= 8e-16 relative on 11 chain
# types: benchmarks/mcmc_diagnostics_crosscheck.py -> docs/validation/mcmc_diagnostics_crosscheck.json
gates = { G0 = "passed", G1 = "passed", G2 = "passed", G3 = "passed", G4 = "not_applicable", G5 = "not_applicable", G6 = "linux_measured", G7 = "not_run" }
implementation_status = "passed"
maturity = "experimental"
known_limits = ["HMC-specific diagnostics do not apply", "ESS of a constant quantity is reported as NaN (ArviZ reports the number of draws); constant quantities are not gated"]
dependencies = ["numpy", "scipy"]

