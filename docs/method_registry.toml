[[method]]
method_id = "dec.smith_hazel"
name = "Smith-Hazel and restricted (Kempthorne-Nordskog) selection index"
estimand = "index coefficients, r_IH, expected response under stated assumptions"
scope = "linear objective H = a'g; information covariance supplied by the user"
math = "docs/methods.md#9-selection-indices"
sources = ["Smith 1936", "Hazel 1943 Genetics 28:476", "Kempthorne & Nordskog 1959 Biometrics 15:10"]
errata = ["index accuracy is sqrt(Var(I)/Var(H)), not a product of variances (Mrode 4th ed. PDF p.63 shortcut)"]
exact_or_approximate = "exact"
complexity = "O(n_x^3)"
code = ["src/abp/decision/selection_index.py", "src/abp/decision/index_cli.py"]
tests = ["tests/test_selection_index.py::test_t02_gold_standard",
         "tests/test_selection_index.py::test_unit_change_of_information_source",
         "tests/test_selection_index.py::test_restricted_index_satisfies_kkt",
         "tests/test_selection_index.py::test_collinear_information_is_reported"]
gates = { G0 = "passed", G1 = "passed", G2 = "passed", G3 = "passed", G4 = "not_run", G5 = "not_run", G6 = "linux_measured_windows_ci_pending", G7 = "not_run" }
implementation_status = "passed"
maturity = "experimental"
known_limits = ["P and C must be derived by the user", "no desired-gains index", "response formula assumes one round of truncation selection"]
dependencies = ["numpy", "scipy"]

