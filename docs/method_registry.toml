# ABP method registry (machine-readable; checked by tests/test_registry.py).
#
# implementation_status: passed | failed | blocked | not_run  (required checks of this round)
# maturity: stable | validated | experimental.  No method is "validated" in 0.1: external
# validation on real data (gate G5) has not been run for any method.
# gates: G0 source/target, G1 mathematics, G2 numerics, G3 software, G4 statistical
# calibration, G5 external validity, G6 scale/platform, G7 decision/release.

schema_version = "1"
registry_date = "2026-09-25"
abp_version = "0.1.0"

[[method]]
method_id = "ped.a_matrix"
name = "Numerator relationship matrix, inverse, inbreeding"
estimand = "relationship structure (not an estimate)"
scope = "diploid, autosomal; unknown parents = distinct unrelated non-inbred base animals; no UPG/metafounders"
math = "docs/methods.md#2-pedigree-relationships"
sources = ["Henderson 1976 Biometrics 32:69", "Quaas 1976 Biometrics 32:949", "Meuwissen & Luo 1992 GSE 24:305", "Colleau 2002 GSE 34:409"]
errata = []
exact_or_approximate = "exact"
complexity = "order O(n); A^-1 O(n); F proportional to (animal, ancestor) pairs; A x by two sparse triangular solves"
code = ["src/abp/core/pedigree.py", "src/abp/_native.cpp"]
tests = ["tests/test_pedigree.py::test_t03_hand_derived_gold_standard",
         "tests/test_pedigree.py::test_against_tabular_reference",
         "tests/test_pedigree.py::test_unknown_parents_are_distinct_base_animals",
         "tests/test_pedigree.py::test_input_order_invariance",
         "tests/test_pedigree.py::test_cycle_is_rejected",
         "tests/test_pedigree.py::test_native_kernel_matches_python_reference"]
gates = { G0 = "passed", G1 = "passed", G2 = "passed", G3 = "passed", G4 = "not_applicable", G5 = "not_run", G6 = "linux_measured_windows_ci_pending", G7 = "not_run" }
implementation_status = "passed"
maturity = "experimental"
known_limits = ["no unknown-parent groups or metafounders", "inbreeding cost grows with pedigree depth (8.7 s for 100k animals x 20 generations)"]
dependencies = ["numpy", "scipy"]

[[method]]
method_id = "lmm.fixed_design"
name = "Fixed-effect design with deterministic set-to-zero constraints"
estimand = "estimable functions of fixed effects"
scope = "intercept, factors, linear covariates"
math = "docs/methods.md#3-fixed-effects-and-estimability"
sources = ["Searle 1971 Linear Models"]
errata = []
exact_or_approximate = "exact (tolerance 1e-9 on squared residual angle)"
complexity = "dense X'X rank scan O(p^3); refused above 20000 columns"
code = ["src/abp/core/design.py"]
tests = ["tests/test_blup.py::test_repeatability_model_matches_v_form",
         "tests/test_blup.py::test_invariance_to_constraint_choice_and_record_order"]
gates = { G0 = "passed", G1 = "passed", G2 = "passed", G3 = "passed", G4 = "not_applicable", G5 = "not_run", G6 = "linux_measured_windows_ci_pending", G7 = "not_run" }
implementation_status = "passed"
maturity = "experimental"
known_limits = ["no nested covariates or covariate-by-factor interactions", "dense rank scan limits fixed-effect columns to 20000"]
dependencies = ["numpy", "scipy"]

[[method]]
method_id = "lmm.mme"
name = "Mixed-model equations: dense Cholesky, sparse direct (SuperLU), Jacobi-PCG"
estimand = "BLUE/BLUP solutions; PEV = block of C^-1 of the unscaled MME"
scope = "symmetric positive definite MME"
math = "docs/methods.md#4-mixed-model-equations-blup-and-pev"
sources = ["Henderson 1975 Biometrics 31:423"]
errata = []
exact_or_approximate = "direct: exact to round-off; PCG: relative residual <= tol (true residual verified)"
complexity = "dense O(N^3); sparse direct fill-in dependent; PCG O(iterations x nnz)"
code = ["src/abp/solvers/mme.py"]
tests = ["tests/test_blup.py::test_solvers_agree_on_larger_problem",
         "tests/test_blup.py::test_pcg_non_convergence_is_an_error",
         "tests/test_blup.py::test_auto_selection_and_pcg_fallback"]
gates = { G0 = "passed", G1 = "passed", G2 = "passed", G3 = "passed", G4 = "not_applicable", G5 = "not_run", G6 = "linux_measured_windows_ci_pending", G7 = "not_run" }
implementation_status = "passed"
maturity = "experimental"
known_limits = ["exact PEV limited to 30000 equations on the sparse path", "no approximate reliabilities yet", "no matrix-free iteration on data"]
dependencies = ["numpy", "scipy (LAPACK, SuperLU)"]

[[method]]
method_id = "blup.single_trait"
name = "Single-trait animal / repeatability model BLUP with known variances"
estimand = "additive_ebv relative to the declared genetic base"
scope = "Gaussian single trait; additive term (A, G or H) plus optional iid terms"
math = "docs/methods.md#4-mixed-model-equations-blup-and-pev"
