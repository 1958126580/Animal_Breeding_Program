method_id = "gen.ssgblup_matrix_free"
name = "Matrix-free single step: H^-1 applied as an operator in PCG (sparse Schur-complement A22^-1, dense or APY G^-1)"
estimand = "additive_ebv (single-step GBLUP solutions)"
scope = "single-trait single step with known variances, solver.pev = 'none'; genomic policies error/ridge/blend, tuning none; exact G^-1 or APY"
math = "docs/methods.md#26-matrix-free-single-step"
sources = ["Stranden & Mantysaari 2014 Proc 10th WCGALP", "Masuda et al. 2017 J Dairy Sci 100:9844", "Misztal, Legarra & Aguilar 2014 J Dairy Sci 97:3943"]
errata = []
exact_or_approximate = "same model and solutions as the explicit single step (to the PCG tolerance, residual verified through the operator)"
complexity = "per PCG iteration: sparse A^-1 product, one sparse LDL' solve with A^11, APY product O(c^2 + c n2); memory O(nnz(A^-1) + c^2 + c n2 + n2 m)"
code = ["src/abp/core/ssop.py", "src/abp/solvers/mme.py", "src/abp/solvers/blup.py", "src/abp/workflows/genomic_inputs.py"]
tests = ["tests/test_single_step_matrix_free.py::test_a22_inverse_operator_equals_dense_inverse",
         "tests/test_single_step_matrix_free.py::test_apy_operator_from_genotypes_equals_dense_apy",
         "tests/test_single_step_matrix_free.py::test_matrix_free_evaluation_equals_explicit",
         "tests/test_single_step_matrix_free.py::test_spec_rules_for_matrix_free"]
gates = { G0 = "passed", G1 = "passed", G2 = "passed", G3 = "passed", G4 = "not_applicable", G5 = "not_run", G6 = "linux_measured", G7 = "not_run" }
implementation_status = "passed"
maturity = "experimental"
known_limits = ["no PEV/reliabilities, no REML", "single trait only", "no tuning, UPG, metafounders or LR validation", "genotype matrix held in memory as float64"]
dependencies = ["numpy", "scipy"]

