         "tests/test_blup.py::test_mrode_example_3_1",
         "tests/test_blup.py::test_repeatability_model_matches_v_form",
         "tests/test_blup.py::test_unit_change_kg_to_g",
         "tests/test_workflow.py::test_example01_end_to_end_matches_independent_reference"]
gates = { G0 = "passed", G1 = "passed", G2 = "passed", G3 = "passed", G4 = "single_replicate_simulation", G5 = "not_run", G6 = "linux_measured_windows_ci_pending", G7 = "not_run" }
implementation_status = "passed"
maturity = "experimental"
known_limits = ["homogeneous residual variance", "no maternal, social or random-regression terms"]
dependencies = ["numpy", "scipy"]

[[method]]
method_id = "reml.single_trait"
name = "REML by average information with EM fallback and active-set boundary"
estimand = "variance components; asymptotic SE from AI^-1 (interior only)"
scope = "single trait; any number of random terms with known structures; dense path"
math = "docs/methods.md#5-reml"
sources = ["Patterson & Thompson 1971", "Gilmour, Thompson & Cullis 1995 Biometrics 51:1440", "Dempster, Laird & Rubin 1977"]
errata = ["genetic-variance derivative uses Z A Z', not Z Z' (spec T05; old R teaching code)"]
exact_or_approximate = "exact likelihood; iterative optimiser (stopping: rel. change and Newton decrement < tol)"
complexity = "each iteration: dense Cholesky + inverse O(N^3)"
code = ["src/abp/solvers/reml.py"]
tests = ["tests/test_reml.py::test_t05_score_matches_v_form_and_detects_wrong_derivative",
         "tests/test_reml.py::test_repeatability_model_loglik_score_ai_match_v_form",
         "tests/test_reml.py::test_reml_optimum_matches_independent_optimizer_and_em",
         "tests/test_reml.py::test_forced_boundary_case_is_detected",
         "tests/test_reml.py::test_non_convergence_is_an_error_and_checkpoint_resume",
         "tests/test_reml.py::test_reml_calibration_by_simulation",
         "tests/test_reml.py::test_reml_with_dense_genomic_structure_matches_v_form"]
gates = { G0 = "passed", G1 = "passed", G2 = "passed", G3 = "passed", G4 = "passed_40_replicate_simulation", G5 = "not_run", G6 = "linux_measured_windows_ci_pending", G7 = "not_run" }
implementation_status = "passed"
maturity = "experimental"
known_limits = ["dense only (memory N^2)", "no multi-trait REML", "SE invalid at the boundary"]
dependencies = ["numpy", "scipy"]

[[method]]
