tests = ["tests/test_genomic.py::test_t01_maf_is_minimum",
         "tests/test_genomic.py::test_allele_flip_invariance",
         "tests/test_genomic.py::test_gblup_equals_snp_blup_including_unphenotyped",
         "tests/test_genomic.py::test_pure_gblup_snp_blup_duality_when_g_is_pd",
         "tests/test_genomic.py::test_singular_g_requires_explicit_policy",
         "tests/test_genomic_workflow.py::test_gblup_workflow_matches_independent_reference",
         "tests/test_genomic_workflow.py::test_excluded_records_cannot_influence_results"]
gates = { G0 = "passed", G1 = "passed", G2 = "passed", G3 = "passed", G4 = "not_run", G5 = "not_run", G6 = "linux_measured_windows_ci_pending", G7 = "not_run" }
implementation_status = "passed"
maturity = "experimental"
known_limits = ["only ABP dosage-matrix text format (no PLINK/VCF/BGEN readers)", "dense G (memory n^2)", "no APY"]
dependencies = ["numpy", "scipy"]

[[method]]
method_id = "gen.h_inverse"
name = "Single-step H^-1 with A22^-1 from A22"
estimand = "combined pedigree-genomic relationship structure"
scope = "genotyped animals must be in the pedigree; optional tuning to A22 and blending"
math = "docs/methods.md#7-single-step"
sources = ["Aguilar et al. 2010 J Dairy Sci 93:743", "Christensen & Lund 2010 GSE 42:2", "Legarra, Aguilar & Misztal 2009"]
errata = ["A22^-1 is not the 22-block of A^-1 (spec T06)"]
exact_or_approximate = "exact"
complexity = "A22 by Colleau products O(n n_g); dense inverses O(n_g^3); diag(H) needs an n x n_g block"
code = ["src/abp/core/genomic.py"]
tests = ["tests/test_genomic.py::test_t06_single_step_identities",
         "tests/test_genomic.py::test_tuning_matches_a22_means",
         "tests/test_genomic_workflow.py::test_single_step_workflow_matches_explicit_h"]
gates = { G0 = "passed", G1 = "passed", G2 = "passed", G3 = "passed", G4 = "single_replicate_simulation", G5 = "not_run", G6 = "linux_measured_windows_ci_pending", G7 = "not_run" }
implementation_status = "passed"
maturity = "experimental"
known_limits = ["no APY or ssSNPBLUP", "no metafounders / unknown-parent groups", "genomic and pedigree base alignment limited to match_a22 tuning"]
dependencies = ["numpy", "scipy"]

