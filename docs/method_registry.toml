# ABP method registry (machine-readable; checked by tests/test_registry.py).
#
# implementation_status: passed | failed | blocked | not_run  (required checks of this round)
# maturity: stable | validated | experimental.  No method is "validated": external
# validation on real data (gate G5) has not been run for any method.
# gates: G0 source/target, G1 mathematics, G2 numerics, G3 software, G4 statistical
# calibration, G5 external validity, G6 scale/platform, G7 decision/release.

schema_version = "1"
registry_date = "2026-09-25"
abp_version = "0.2.0"

[[method]]
method_id = "ped.a_matrix"
name = "Numerator relationship matrix, inverse, inbreeding"
estimand = "relationship structure (not an estimate)"
scope = "diploid, autosomal; unknown parents = distinct unrelated non-inbred base animals (genetic groups: see ped.upg; no metafounders)"
math = "docs/methods.md#2-pedigree-relationships"
sources = ["Henderson 1976 Biometrics 32:69", "Quaas 1976 Biometrics 32:949", "Meuwissen & Luo 1992 GSE 24:305", "Colleau 2002 GSE 34:409"]
errata = []
exact_or_approximate = "exact"
complexity = "order O(n); A^-1 O(n); F proportional to (animal, ancestor) pairs; A x by two sparse triangular solves"
code = ["src/abp/core/pedigree.py", "src/abp/_native.cpp"]
tests = ["tests/test_pedigree.py::test_t03_hand_derived_gold_standard",
         "tests/test_pedigree.py::test_against_tabular_reference",
         "tests/test_pedigree.py::test_unknown_parents_are_distinct_base_animals",
         "tests/test_pedigree.py::test_input_order_invariance",
         "tests/test_pedigree.py::test_cycle_is_rejected",
         "tests/test_pedigree.py::test_native_kernel_matches_python_reference"]
gates = { G0 = "passed", G1 = "passed", G2 = "passed", G3 = "passed", G4 = "not_applicable", G5 = "not_run", G6 = "linux_measured_windows_ci_passed", G7 = "not_run" }
implementation_status = "passed"
maturity = "experimental"
known_limits = ["no metafounders", "inbreeding cost grows with pedigree depth (8.7 s for 100k animals x 20 generations)"]
dependencies = ["numpy", "scipy"]

